services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    # Adminer Evo: drop-in Adminer fork that supports defaulting the driver to
    # PostgreSQL (the official image only pre-fills the host, leaving the System
    # dropdown on MySQL).
    image: shyim/adminerevo:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_DRIVER: pgsql
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DEFAULT_USER: ${POSTGRES_USER:-crm}
      ADMINER_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      ADMINER_DEFAULT_DB: ${POSTGRES_DB:-crm}
    ports:
      - "${ADMINER_PORT:-81}:8080"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm}@db:5432/${POSTGRES_DB:-crm}?schema=public
      PORT: 3001
      STAGNANT_THRESHOLD_DAYS: ${STAGNANT_THRESHOLD_DAYS:-14}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@crm.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      # URL used by the browser (host) to reach the backend.
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-3001}/api
      # URL used by Next.js server-side code (inside the docker network).
      API_INTERNAL_URL: http://backend:3001/api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  db_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
